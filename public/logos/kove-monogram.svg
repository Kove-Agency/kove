<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="Kove monogram">
  <title>Kove</title>
  <!-- Background dark (rounded square) -->
  <rect width="100" height="100" fill="#0f0f0f" rx="22"/>
  <!-- Stem: bold thick vertical bar -->
  <rect x="20" y="18" width="22" height="64" fill="#ffffff"/>
  <!-- Upper arm: white parallelogram, thick -->
  <polygon points="42,50 62,50 82,18 62,18" fill="#ffffff"/>
  <!-- Lower arm: CYAN parallelogram (signature), thick -->
  <polygon points="42,50 62,50 82,82 62,82" fill="#22d3ee"/>
</svg>
