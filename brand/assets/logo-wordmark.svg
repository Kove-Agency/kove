<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 100" width="520" height="100" role="img" aria-label="Kove">
  <title>Kove</title>
  <!-- Icon: Sliced K with cyan, thicker proportions -->
  <g transform="translate(0, 8)">
    <!-- Stem (thick) -->
    <rect x="0" y="0" width="20" height="84" fill="#ffffff"/>
    <!-- Upper arm white -->
    <polygon points="20,42 38,42 58,0 40,0" fill="#ffffff"/>
    <!-- Lower arm cyan -->
    <polygon points="20,42 38,42 58,84 40,84" fill="#22d3ee"/>
  </g>
  <!-- Wordmark "Kove" -->
  <text x="86" y="68"
        font-family="Space Grotesk, system-ui, sans-serif"
        font-weight="500"
        font-size="62"
        letter-spacing="-2.5"
        fill="#ffffff">Kove</text>
</svg>
