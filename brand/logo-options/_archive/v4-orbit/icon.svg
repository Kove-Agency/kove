<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="Kove icon — Orbit">
  <title>Kove — Orbit</title>
  <!-- Outer thin orbit ring -->
  <circle cx="50" cy="50" r="42" fill="none" stroke="currentColor" stroke-width="2.5"/>
  <!-- K inscribed: stem -->
  <rect x="32" y="22" width="7" height="56" fill="currentColor"/>
  <!-- Upper arm -->
  <polygon points="39,50 60,22 70,22 49,50" fill="currentColor"/>
  <!-- Lower arm -->
  <polygon points="39,50 49,50 70,78 60,78" fill="currentColor"/>
  <!-- Cyan satellite on the orbit (top-right, deliberate strategic position) -->
  <circle cx="80" cy="20" r="4.5" fill="#22d3ee"/>
</svg>
