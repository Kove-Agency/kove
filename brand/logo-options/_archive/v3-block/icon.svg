<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="Kove icon — Block">
  <title>Kove — Block</title>
  <!-- Solid slanted block (parallelogram, leans right like motion / forward) -->
  <polygon points="22,12 92,12 78,88 8,88" fill="currentColor"/>
  <!-- K shape carved out in negative (uses dark color so it punches through) -->
  <!-- Stem -->
  <rect x="32" y="26" width="9" height="48" fill="#0f0f0f"/>
  <!-- Upper arm -->
  <polygon points="41,50 60,26 70,26 49,50" fill="#0f0f0f"/>
  <!-- Lower arm -->
  <polygon points="41,50 49,50 70,74 60,74" fill="#0f0f0f"/>
  <!-- Cyan signature: a sliver on the right edge, like a back-light -->
  <polygon points="92,12 96,12 82,88 78,88" fill="#22d3ee"/>
</svg>
