<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="Kove monogram">
  <title>Kove</title>
  <!-- Background dark (rounded square) -->
  <rect width="100" height="100" fill="#0f0f0f" rx="22"/>
  <!-- Stem: thick vertical bar -->
  <rect x="22" y="22" width="13" height="56" fill="#ffffff"/>
  <!-- Upper arm: white parallelogram -->
  <polygon points="35,50 49,50 76,22 62,22" fill="#ffffff"/>
  <!-- Lower arm: CYAN parallelogram (signature) -->
  <polygon points="35,50 49,50 76,78 62,78" fill="#22d3ee"/>
</svg>
